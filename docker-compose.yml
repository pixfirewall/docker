x-kong-build: &kong-build
  image: local-kong:${KONG_VERSION:-3.7.1-ubuntu}
  build:
    context: ./data/kong
    dockerfile: Dockerfile
    args:
      - KONG_VERSION=${KONG_VERSION:-3.7.1-ubuntu}

services:
  kong-setup:
    <<: *kong-build
    container_name: kong-setup
    env_file: env/kong.env
    volumes:
      - ${SSL_CERTS_LOCATION:-./certs}:/opt/certs
    # `bootstrap` is a no-op on an already bootstrapped database, `up`/`finish` apply pending migrations after upgrades
    command: ["sh", "-c", "kong migrations bootstrap && kong migrations up && kong migrations finish"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - develop

  kong:
    <<: *kong-build
    container_name: kong
    env_file: env/kong.env
    ports:
      - 8000:8000
      - 8001:8001
      - 8002:8002
      - 8443:8443
      - 8444:8444
    volumes:
      # - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      # - kong_tmp_vol:/tmp
      # - kong_config_vol:/opt/kong
      - ./data/kong/kong.yaml:/opt/kong/kong.yaml:ro
      - ${SSL_CERTS_LOCATION:-./certs}:/opt/certs
    extra_hosts:
      # Make host.docker.internal (used in kong.yaml) resolvable on Linux as well
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges
    depends_on:
      kong-setup:
        condition: service_completed_successfully
    networks:
      - develop

  keycloak:
    # image: ${CONTAINER_REGISTRY:-localhost}/auth/keycloak:${KEYCLOAK_VERSION:-latest}
    image: local-keycloak:latest
    build:
      context: ./data/keycloak
      dockerfile: Dockerfile
      args:
        - KC_DB=${KC_DB}
        - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED}
        - KC_METRICS_ENABLED=${KC_METRICS_ENABLED}
      target: builder
    container_name: keycloak
    env_file: env/keycloak.env
    ports:
      - "8445:8443"
    command: "start --optimized"
    # command: "start --verbose"
    volumes:
      - ${SSL_CERTS_LOCATION:-./certs}:/opt/certs/conf/keys
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - develop

  redis:
    image: redis:6.2-alpine
    container_name: redis
    restart: always
    # env_file: env/redis.env
    ports:
      - "6379:6379"
    # command: redis-server --save 20 1 --loglevel warning --requirepass <password>
    volumes:
      - ./data/redis/data/:/data
    networks:
      - develop

  postgres:
    image: postgres:14-alpine
    container_name: postgres
    restart: always
    env_file: env/postgres.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # a sub directory, initdb refuses a non-empty data dir (data/.gitignore)
      - ./data/postgres/data/pgdata:/var/lib/postgresql/data
      - ./data/postgres/init:/docker-entrypoint-initdb.d:ro
      - ${SSL_CERTS_LOCATION:-./certs}:/var/lib/postgresql/certs
    # command: >
    #   -c ssl=on
    #   -c ssl_cert_file=/var/lib/postgresql/certs/ca.pem
    #   -c ssl_key_file=/var/lib/postgresql/certs/ca.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - develop

  mysql:
    image: mysql/mysql-server:5.7
    container_name: mysql
    # mysql/mysql-server:5.7 is only published for amd64
    platform: linux/amd64
    env_file: env/mysql.env
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      # a sub directory, mysqld --initialize refuses a non-empty data dir (data/.gitignore)
      - ./data/mysql/data/db:/var/lib/mysql
    ports:
      - '${MYSQL_DATABASE_PORT:-3306}:3306'
    networks:
      - develop

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    env_file: env/mongodb.env
    # command: mongod --auth
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - ./data/mongodb/data:/data/db
    networks:
      - develop

  nui:
    image: ghcr.io/nats-nui/nui
    container_name: nui
    ports:
      - "31311:31311"
    volumes:
      - ./data/nuidb:/db
    depends_on:
      - nats
    networks:
      - develop

  nats:
    image: nats
    container_name: nats
    restart: always
    env_file: env/nats.env
    # command: ['-js', '-m', '8222', '-p', '4222']
    command: "--http_port 8222 --user ${NATS_USER} --pass ${NATS_PASSWORD} --jetstream"
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - develop

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - '${MYSQL_ADMINER_PORT:-8080}:8080'
    networks:
      - develop

  plantuml-server:
    # build:
    #   context: ./data/plantuml
    #   dockerfile: Dockerfile.jetty
    image: plantuml/plantuml-server:jetty
    container_name: plantuml-server
    env_file: env/plantuml.env
    ports:
      - 8065:8080
    networks:
      - develop

  localstack:
    # releases after 4.14 refuse to start without a LocalStack account (LOCALSTACK_AUTH_TOKEN)
    image: localstack/localstack:${LOCALSTACK_VERSION:-4.14}
    container_name: localstack
    environment:
      - LOCALSTACK_AUTH_TOKEN
    ports:
      - '4566:4566'           # LocalStack gateway
      - '4510-4559:4510-4559' # external services port range
    volumes:
      - ./data/localstack/data:/var/lib/localstack
      - ./data/localstack/init:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - develop

  sonarqube:
    image: sonarqube:8.9.2-community
    container_name: sonarqube
    platform: linux/amd64
    restart: always
    ports:
      - '9000:9000'
    volumes:
      - ./data/sonarqube/extensions:/opt/sonarqube/extensions
    networks:
      - develop

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: always
    # restart: unless-stopped
    # hostname: mosquitto
    env_file: env/mosquitto.env
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./data/mosquitto:/etc/mosquitto
      - ./data/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - develop

  rabbitmq:
    image: local-rabbitmq:latest
    build:
      context: ./data/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    restart: always
    env_file: env/rabbitmq.env
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ./data/rabbitmq/data/:/var/lib/rabbitmq/
      - ./data/rabbitmq/log/:/var/log/rabbitmq/
    networks:
      - develop

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    # Opt-in only (`docker compose --profile haproxy up -d`): requires ./data/haproxy/haproxy.cfg
    profiles:
      - haproxy
    volumes:
      - ./data/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - rabbitmq
    ports:
      # HOST:CONTAINER - host ports must not clash with the rabbitmq service
      - 15673:15672
      - 5673:5672
    networks:
      - develop

  test:
    build:
      context: ./test-node
      dockerfile: Dockerfile
    container_name: test
    volumes:
      - ./test-node:/app
      # keep the node_modules installed in the image instead of the host bind mount
      - /app/node_modules
    ports:
      - 3007:3007
    networks:
      - develop

networks:
  develop:
    driver: bridge

