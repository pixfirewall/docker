x-kong-build: &kong-build
  image: local-kong:${KONG_VERSION:-3.7.1-ubuntu}
  build:
    context: ./data/kong
    dockerfile: Dockerfile
    args:
      - KONG_VERSION=${KONG_VERSION:-3.7.1-ubuntu}

services:
  kong-setup:
    <<: *kong-build
    container_name: kong-setup
    env_file: env/kong.env
    volumes:
      - ${SSL_CERTS_LOCATION:-./certs}:/opt/certs
    # `bootstrap` is a no-op on an already bootstrapped database, `up`/`finish` apply pending migrations after upgrades
    command: ["sh", "-c", "kong migrations bootstrap && kong migrations up && kong migrations finish"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - develop

  kong:
    <<: *kong-build
    container_name: kong
    restart: unless-stopped
    env_file: env/kong.env
    ports:
      - 8000:8000
      - 8001:8001
      - 8002:8002
      - 8443:8443
      - 8444:8444
    volumes:
      # - kong_prefix_vol:${KONG_PREFIX:-/var/run/kong}
      # - kong_tmp_vol:/tmp
      # - kong_config_vol:/opt/kong
      - ./data/kong/kong.yaml:/opt/kong/kong.yaml:ro
      - ${SSL_CERTS_LOCATION:-./certs}:/opt/certs
    extra_hosts:
      # Make host.docker.internal (used in kong.yaml) resolvable on Linux as well
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges
    depends_on:
      kong-setup:
        condition: service_completed_successfully
    networks:
      - develop

  keycloak:
    # image: ${CONTAINER_REGISTRY:-localhost}/auth/keycloak:${KEYCLOAK_VERSION:-latest}
    image: local-keycloak:latest
    build:
      context: ./data/keycloak
      dockerfile: Dockerfile
      args:
        - KC_DB=${KC_DB}
        - KC_HEALTH_ENABLED=${KC_HEALTH_ENABLED}
        - KC_METRICS_ENABLED=${KC_METRICS_ENABLED}
      target: builder
    container_name: keycloak
    restart: unless-stopped
    env_file: env/keycloak.env
    ports:
      - "8445:8443"
    # --import-realm creates the realms in data/keycloak/import on first start (existing realms are skipped)
    command: "start --optimized --import-realm"
    # command: "start --verbose"
    volumes:
      - ${SSL_CERTS_LOCATION:-./certs}:/opt/certs/conf/keys
      - ./data/keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # the image has no curl, check that the management interface (health/metrics) accepts connections
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - develop

  redis:
    image: redis:8.10-alpine
    container_name: redis
    restart: always
    # env_file: env/redis.env
    ports:
      - "6379:6379"
    # command: redis-server --save 20 1 --loglevel warning --requirepass <password>
    volumes:
      - ./data/redis/data/:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - develop

  postgres:
    image: postgres:18-alpine
    container_name: postgres
    restart: always
    env_file: env/postgres.env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep the data in a version specific sub directory (/var/lib/postgresql/18/docker)
      # and refuse a mount at /var/lib/postgresql/data. Data of the previous postgres:14 setup stays in
      # ./data/postgres/data/pgdata, see "Upgrading Postgres" in the README.
      - ./data/postgres/data/pg18:/var/lib/postgresql
      - ./data/postgres/init:/docker-entrypoint-initdb.d:ro
      - ${SSL_CERTS_LOCATION:-./certs}:/var/lib/postgresql/certs
    # command: >
    #   -c ssl=on
    #   -c ssl_cert_file=/var/lib/postgresql/certs/ca.pem
    #   -c ssl_key_file=/var/lib/postgresql/certs/ca.key
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - develop

  mysql:
    image: mysql/mysql-server:8.0
    container_name: mysql
    env_file: env/mysql.env
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    volumes:
      # a sub directory, mysqld --initialize refuses a non-empty data dir (data/.gitignore)
      - ./data/mysql/data/db:/var/lib/mysql
    ports:
      - '${MYSQL_DATABASE_PORT:-3306}:3306'
    networks:
      - develop

  mongodb:
    image: mongo
    container_name: mongodb
    restart: always
    env_file: env/mongodb.env
    # command: mongod --auth
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - ./data/mongodb/data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - develop

  nui:
    image: ghcr.io/nats-nui/nui
    container_name: nui
    ports:
      - "31311:31311"
    volumes:
      - ./data/nuidb:/db
    depends_on:
      - nats
    networks:
      - develop

  nats:
    image: nats
    container_name: nats
    restart: always
    env_file: env/nats.env
    # command: ['-js', '-m', '8222', '-p', '4222']
    command: "--http_port 8222 --user ${NATS_USER} --pass ${NATS_PASSWORD} --jetstream"
    ports:
      - "4222:4222"
      - "8222:8222"
    networks:
      - develop

  adminer:
    image: adminer
    container_name: adminer
    restart: always
    ports:
      - '${MYSQL_ADMINER_PORT:-8080}:8080'
    networks:
      - develop

  plantuml-server:
    # build:
    #   context: ./data/plantuml
    #   dockerfile: Dockerfile.jetty
    image: plantuml/plantuml-server:jetty
    container_name: plantuml-server
    env_file: env/plantuml.env
    ports:
      - 8065:8080
    networks:
      - develop

  localstack:
    # releases after 4.14 refuse to start without a LocalStack account (LOCALSTACK_AUTH_TOKEN)
    image: localstack/localstack:${LOCALSTACK_VERSION:-4.14}
    container_name: localstack
    environment:
      - LOCALSTACK_AUTH_TOKEN
    ports:
      - '4566:4566'           # LocalStack gateway
      - '4510-4559:4510-4559' # external services port range
    volumes:
      - ./data/localstack/data:/var/lib/localstack
      - ./data/localstack/init:/etc/localstack/init/ready.d
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - develop

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    restart: always
    ports:
      - '9000:9000'
    volumes:
      - ./data/sonarqube/extensions:/opt/sonarqube/extensions
    networks:
      - develop

  mosquitto:
    image: eclipse-mosquitto
    container_name: mosquitto
    restart: always
    # restart: unless-stopped
    # hostname: mosquitto
    env_file: env/mosquitto.env
    ports:
      - 1883:1883
      - 9001:9001
    volumes:
      - ./data/mosquitto:/etc/mosquitto
      - ./data/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf
    networks:
      - develop

  rabbitmq:
    image: local-rabbitmq:latest
    build:
      context: ./data/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    restart: always
    env_file: env/rabbitmq.env
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - ./data/rabbitmq/data/:/var/lib/rabbitmq/
      - ./data/rabbitmq/log/:/var/log/rabbitmq/
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s
    networks:
      - develop

  haproxy:
    image: haproxy:latest
    container_name: haproxy
    # Opt-in only (`docker compose --profile haproxy up -d`): requires ./data/haproxy/haproxy.cfg
    profiles:
      - haproxy
    volumes:
      - ./data/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      # HOST:CONTAINER - host ports must not clash with the rabbitmq service
      - 15673:15672
      - 5673:5672
    networks:
      - develop

  test:
    build:
      context: ./test-node
      dockerfile: Dockerfile
    container_name: test
    # npm does not forward SIGTERM, without an init process `docker compose stop` waits 10s
    init: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    volumes:
      - ./test-node:/app
      # keep the node_modules installed in the image instead of the host bind mount
      - /app/node_modules
    ports:
      - 3007:3007
    networks:
      - develop

  # ---------------------------------------------------------------------------
  # Optional developer tools, started only with `--profile tools`
  # ---------------------------------------------------------------------------

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.31}
    container_name: mailpit
    profiles:
      - tools
    restart: unless-stopped
    environment:
      # accept any SMTP credentials without TLS, so apps configured with auth work too
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    networks:
      - develop

  mongo-express:
    image: mongo-express:${MONGO_EXPRESS_VERSION:-1.0.2}
    container_name: mongo-express
    profiles:
      - tools
    restart: unless-stopped
    env_file: env/mongo-express.env
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - develop

  redisinsight:
    image: redis/redisinsight:${REDISINSIGHT_VERSION:-3.8}
    container_name: redisinsight
    profiles:
      - tools
    restart: unless-stopped
    environment:
      # pre-configured connection to the redis service
      - RI_REDIS_HOST=redis
      - RI_REDIS_PORT=6379
      - RI_REDIS_ALIAS=redis
    ports:
      - "${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - develop

  dozzle:
    image: amir20/dozzle:${DOZZLE_VERSION:-v11.1}
    container_name: dozzle
    profiles:
      - tools
    restart: unless-stopped
    ports:
      - "${DOZZLE_PORT:-8888}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - develop

  homepage:
    image: ghcr.io/gethomepage/homepage:${HOMEPAGE_VERSION:-v2.4.0}
    container_name: homepage
    profiles:
      - tools
    restart: unless-stopped
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=localhost:${HOMEPAGE_PORT:-3080},127.0.0.1:${HOMEPAGE_PORT:-3080}
    ports:
      - "${HOMEPAGE_PORT:-3080}:3000"
    volumes:
      - ./data/homepage:/app/config
      # container status on the dashboard
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - develop

  wiremock:
    image: wiremock/wiremock:${WIREMOCK_VERSION:-3.13.2}
    container_name: wiremock
    profiles:
      - tools
    restart: unless-stopped
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "${WIREMOCK_PORT:-8092}:8080"
    volumes:
      - ./data/wiremock/mappings:/home/wiremock/mappings
      - ./data/wiremock/__files:/home/wiremock/__files
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8080/__admin/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - develop

  vault:
    image: hashicorp/vault:${VAULT_VERSION:-2.1}
    container_name: vault
    profiles:
      - tools
    restart: unless-stopped
    # dev mode: in-memory storage, unsealed, root token from env/vault.env - never use outside local development
    command: ["server", "-dev"]
    env_file: env/vault.env
    cap_add:
      - IPC_LOCK
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - develop

  # ---------------------------------------------------------------------------
  # Optional observability stack, started only with `--profile observability`
  # ---------------------------------------------------------------------------

  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.14.0}
    container_name: prometheus
    profiles:
      - observability
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./data/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${SSL_CERTS_LOCATION:-./certs}/ca.pem:/etc/prometheus/certs/ca.pem:ro
      # named volume: prometheus runs as `nobody` and cannot write to bind mounts on Linux
      - prometheus_data:/prometheus
    networks:
      - develop

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2}
    container_name: grafana
    profiles:
      - observability
    restart: unless-stopped
    env_file: env/grafana.env
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./data/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./data/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./data/grafana/dashboards:/var/lib/grafana/dashboards:ro
      # named volume: grafana runs as uid 472 and cannot write to bind mounts on Linux
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - jaeger
      - loki
    networks:
      - develop

  jaeger:
    # 2.21 removed the /api/services endpoints the Grafana Jaeger datasource still relies on
    image: jaegertracing/jaeger:${JAEGER_VERSION:-2.20.0}
    container_name: jaeger
    profiles:
      - observability
    restart: unless-stopped
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTLP_GRPC_PORT:-4317}:4317"  # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"  # OTLP HTTP
    networks:
      - develop

  loki:
    image: grafana/loki:${LOKI_VERSION:-3.6.17}
    container_name: loki
    profiles:
      - observability
    restart: unless-stopped
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - loki_data:/loki
    networks:
      - develop

  alloy:
    image: grafana/alloy:${ALLOY_VERSION:-v1.19.2}
    container_name: alloy
    profiles:
      - observability
    restart: unless-stopped
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      # only ship the logs of this compose project to Loki
      - COMPOSE_PROJECT=${COMPOSE_PROJECT_NAME}
    ports:
      - "${ALLOY_PORT:-12345}:12345"
    volumes:
      - ./data/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy/data
    depends_on:
      - loki
    networks:
      - develop

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:${POSTGRES_EXPORTER_VERSION:-v0.20.1}
    container_name: postgres-exporter
    profiles:
      - observability
    restart: unless-stopped
    env_file: env/postgres-exporter.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - develop

  redis-exporter:
    image: oliver006/redis_exporter:${REDIS_EXPORTER_VERSION:-v1.91.1}
    container_name: redis-exporter
    profiles:
      - observability
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - develop

  mongodb-exporter:
    image: percona/mongodb_exporter:${MONGODB_EXPORTER_VERSION:-0.53.0}
    container_name: mongodb-exporter
    profiles:
      - observability
    restart: unless-stopped
    command: ["--collect-all", "--compatible-mode"]
    env_file: env/mongodb-exporter.env
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - develop

  nats-exporter:
    image: natsio/prometheus-nats-exporter:${NATS_EXPORTER_VERSION:-0.20.2}
    container_name: nats-exporter
    profiles:
      - observability
    restart: unless-stopped
    command: ["-varz", "-connz", "-jsz=all", "http://nats:8222"]
    depends_on:
      - nats
    networks:
      - develop

  # one-shot: enables Kong's prometheus and opentelemetry plugins (idempotent, fixed plugin ids)
  kong-observability:
    image: curlimages/curl:${CURL_VERSION:-8.22.0}
    container_name: kong-observability
    profiles:
      - observability
    volumes:
      - ./data/kong/observability-plugins.sh:/observability-plugins.sh:ro
    command: ["sh", "/observability-plugins.sh"]
    depends_on:
      kong:
        condition: service_healthy
    networks:
      - develop

  # ---------------------------------------------------------------------------
  # Optional Kafka, started only with `--profile kafka`
  # ---------------------------------------------------------------------------

  kafka:
    image: apache/kafka:${KAFKA_VERSION:-4.3.1}
    container_name: kafka
    profiles:
      - kafka
    restart: unless-stopped
    env_file: env/kafka.env
    ports:
      # external listener for clients on the host, containers use kafka:9092
      - "${KAFKA_PORT:-9094}:9094"
    volumes:
      # named volume: kafka runs as appuser and cannot write to bind mounts on Linux
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 15s
    networks:
      - develop

  kafka-ui:
    image: kafbat/kafka-ui:${KAFKA_UI_VERSION:-v1.5.0}
    container_name: kafka-ui
    profiles:
      - kafka
    restart: unless-stopped
    environment:
      - KAFKA_CLUSTERS_0_NAME=local
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - DYNAMIC_CONFIG_ENABLED=true
    ports:
      - "${KAFKA_UI_PORT:-8090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - develop

  # ---------------------------------------------------------------------------
  # Optional search engine, started only with `--profile search`
  # ---------------------------------------------------------------------------

  opensearch:
    image: opensearchproject/opensearch:${OPENSEARCH_VERSION:-3.8.0}
    container_name: opensearch
    profiles:
      - search
    restart: unless-stopped
    env_file: env/opensearch.env
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
    volumes:
      # named volume: opensearch runs as uid 1000 and cannot write to bind mounts on Linux
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs 'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 30s
    networks:
      - develop

  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:${OPENSEARCH_VERSION:-3.8.0}
    container_name: opensearch-dashboards
    profiles:
      - search
    restart: unless-stopped
    environment:
      - OPENSEARCH_HOSTS=["http://opensearch:9200"]
      - DISABLE_SECURITY_DASHBOARDS_PLUGIN=true
    ports:
      - "${OPENSEARCH_DASHBOARDS_PORT:-5601}:5601"
    depends_on:
      opensearch:
        condition: service_healthy
    networks:
      - develop

  # ===========================================================================
  # Self-hosted applications. Each group has its own profile, `selfhosted` starts all of them.
  # ===========================================================================

  # --- cloud: Nextcloud (uses the shared postgres + redis) ---------------------

  nextcloud:
    image: nextcloud:${NEXTCLOUD_VERSION:-34.0.4-apache}
    container_name: nextcloud
    profiles: [cloud, selfhosted]
    restart: unless-stopped
    env_file: env/nextcloud.env
    ports:
      - "${NEXTCLOUD_PORT:-8084}:80"
    volumes:
      - nextcloud_html:/var/www/html
      # creates the nextcloud database in the shared postgres before the installation
      - ./data/nextcloud/hooks/pre-installation:/docker-entrypoint-hooks.d/pre-installation:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://127.0.0.1/status.php | grep -q '\"installed\":true'"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 60s
    networks:
      - develop

  # runs Nextcloud background jobs every 5 minutes
  nextcloud-cron:
    image: nextcloud:${NEXTCLOUD_VERSION:-34.0.4-apache}
    container_name: nextcloud-cron
    profiles: [cloud, selfhosted]
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nextcloud_html:/var/www/html
    depends_on:
      nextcloud:
        condition: service_healthy
    networks:
      - develop

  # --- photos: Immich (own postgres with vector extensions + valkey, as upstream requires) ---

  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3.2.2}
    container_name: immich-server
    profiles: [photos, selfhosted]
    restart: unless-stopped
    env_file: env/immich.env
    ports:
      - "${IMMICH_PORT:-2283}:2283"
    volumes:
      # uploaded photos / videos
      - ./data/immich/library:/data
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-database:
        condition: service_healthy
    networks:
      - develop

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3.2.2}
    container_name: immich-machine-learning
    profiles: [photos, selfhosted]
    restart: unless-stopped
    env_file: env/immich.env
    volumes:
      - immich_model_cache:/cache
    networks:
      - develop

  immich-redis:
    image: valkey/valkey:9.0-alpine
    container_name: immich-redis
    profiles: [photos, selfhosted]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - develop

  immich-database:
    # pinned to the image referenced by the Immich release compose file
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    container_name: immich-database
    profiles: [photos, selfhosted]
    restart: unless-stopped
    env_file: env/immich.env
    environment:
      POSTGRES_INITDB_ARGS: "--data-checksums"
    shm_size: 128mb
    volumes:
      - immich_pgdata:/var/lib/postgresql/data
    networks:
      - develop

  # --- media: Jellyfin (video) + Navidrome (music) ----------------------------

  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-12.1}
    container_name: jellyfin
    profiles: [media, selfhosted]
    restart: unless-stopped
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      # put movies / series / music in ./data/media
      - ./data/media:/media:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8096/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - develop

  navidrome:
    image: deluan/navidrome:${NAVIDROME_VERSION:-0.64.0}
    container_name: navidrome
    profiles: [media, selfhosted]
    restart: unless-stopped
    environment:
      - ND_SCANSCHEDULE=1h
      - ND_LOGLEVEL=info
    ports:
      - "${NAVIDROME_PORT:-4534}:4533"
    volumes:
      - navidrome_data:/data
      - ./data/media/music:/music:ro
    networks:
      - develop

  # --- smarthome: Home Assistant (MQTT broker: the mosquitto service) ----------

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:${HOMEASSISTANT_VERSION:-2026.9.2}
    container_name: homeassistant
    profiles: [smarthome, selfhosted]
    restart: unless-stopped
    environment:
      - TZ=${TZ:-UTC}
    # bridge network so it works on Docker Desktop; device discovery (mDNS, UPnP) needs
    # `network_mode: host` on a Linux host instead
    ports:
      - "${HOMEASSISTANT_PORT:-8123}:8123"
    volumes:
      - ./data/homeassistant/config:/config
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8123/manifest.json"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks:
      - develop

  # --- dns: AdGuard Home ------------------------------------------------------

  adguard:
    image: adguard/adguardhome:${ADGUARD_VERSION:-v0.107.79}
    container_name: adguard
    profiles: [dns, selfhosted]
    restart: unless-stopped
    ports:
      # DNS, set ADGUARD_DNS_PORT if port 53 is taken (e.g. systemd-resolved on Linux)
      - "${ADGUARD_DNS_PORT:-53}:53/tcp"
      - "${ADGUARD_DNS_PORT:-53}:53/udp"
      # setup wizard (first start only)
      - "${ADGUARD_SETUP_PORT:-3002}:3000"
      # web UI after the setup, choose port 80 in the wizard
      - "${ADGUARD_WEB_PORT:-8083}:80"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    networks:
      - develop

  # --- admin: Portainer + Uptime Kuma -----------------------------------------

  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION:-2.39.8}
    container_name: portainer
    profiles: [admin, selfhosted]
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    networks:
      - develop

  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_VERSION:-2.5.5}
    container_name: uptime-kuma
    profiles: [admin, selfhosted]
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - uptime_kuma_data:/app/data
      # lets monitors of type "Docker container" check container states
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - develop

  # --- apps: productivity and developer apps ----------------------------------

  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-1.37.3}
    container_name: vaultwarden
    profiles: [apps, selfhosted]
    restart: unless-stopped
    env_file: env/vaultwarden.env
    ports:
      - "${VAULTWARDEN_PORT:-8085}:80"
    volumes:
      - vaultwarden_data:/data
    networks:
      - develop

  forgejo:
    image: codeberg.org/forgejo/forgejo:${FORGEJO_VERSION:-16}
    container_name: forgejo
    profiles: [apps, selfhosted]
    restart: unless-stopped
    env_file: env/forgejo.env
    ports:
      - "${FORGEJO_PORT:-3003}:3000"
      - "${FORGEJO_SSH_PORT:-2222}:22"
    volumes:
      - forgejo_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:3000/api/healthz"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - develop

  n8n:
    image: n8nio/n8n:${N8N_VERSION:-2.40.2}
    container_name: n8n
    profiles: [apps, selfhosted]
    restart: unless-stopped
    env_file: env/n8n.env
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - develop

  paperless:
    image: paperlessngx/paperless-ngx:${PAPERLESS_VERSION:-3.1.3}
    container_name: paperless
    profiles: [apps, selfhosted]
    restart: unless-stopped
    env_file: env/paperless.env
    ports:
      - "${PAPERLESS_PORT:-8010}:8000"
    volumes:
      - paperless_data:/usr/src/paperless/data
      - paperless_media:/usr/src/paperless/media
      # drop PDFs / images here to import them
      - ./data/paperless/consume:/usr/src/paperless/consume
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - develop

  stirling-pdf:
    image: stirlingtools/stirling-pdf:${STIRLING_PDF_VERSION:-2.14.3}
    container_name: stirling-pdf
    profiles: [apps, selfhosted]
    restart: unless-stopped
    ports:
      - "${STIRLING_PDF_PORT:-8086}:8080"
    volumes:
      - stirling_pdf_configs:/configs
    networks:
      - develop

  syncthing:
    image: syncthing/syncthing:${SYNCTHING_VERSION:-2.1.5}
    container_name: syncthing
    profiles: [apps, selfhosted]
    restart: unless-stopped
    hostname: dev-stack-syncthing
    ports:
      - "${SYNCTHING_UI_PORT:-8384}:8384"
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
    volumes:
      - ./data/syncthing:/var/syncthing
    networks:
      - develop

  it-tools:
    image: corentinth/it-tools:${IT_TOOLS_VERSION:-2024.10.22-7ca5933}
    container_name: it-tools
    profiles: [apps, selfhosted]
    restart: unless-stopped
    ports:
      - "${IT_TOOLS_PORT:-8087}:80"
    networks:
      - develop

  excalidraw:
    image: excalidraw/excalidraw:${EXCALIDRAW_VERSION:-latest}
    container_name: excalidraw
    profiles: [apps, selfhosted]
    restart: unless-stopped
    ports:
      - "${EXCALIDRAW_PORT:-8088}:80"
    networks:
      - develop

networks:
  develop:
    driver: bridge

volumes:
  redisinsight_data:
  prometheus_data:
  grafana_data:
  loki_data:
  alloy_data:
  kafka_data:
  opensearch_data:
  nextcloud_html:
  immich_model_cache:
  immich_pgdata:
  jellyfin_config:
  jellyfin_cache:
  navidrome_data:
  adguard_work:
  adguard_conf:
  portainer_data:
  uptime_kuma_data:
  vaultwarden_data:
  forgejo_data:
  n8n_data:
  paperless_data:
  paperless_media:
  stirling_pdf_configs:

