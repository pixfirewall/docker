# Minimal OpenSMTPD relay: accepts mail from anyone and delivers everything to mailpit.
# Only published on 127.0.0.1 (see docker-compose.yml), never expose an open relay.
listen on 0.0.0.0 port 25 hostname opensmtpd.example.test

action "to_mailpit" relay host smtp://mailpit:1025

match from any for any action "to_mailpit"
