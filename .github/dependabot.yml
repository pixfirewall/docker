version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /data/kong
      - /data/keycloak
      - /data/rabbitmq
      - /test-node
    schedule:
      interval: weekly
    groups:
      dockerfile-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /test-node
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
