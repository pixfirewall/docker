version: 2
updates:
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # major versions of stateful services change the data format and need a manual migration
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mysql/mysql-server"
        update-types: ["version-update:semver-major"]
      - dependency-name: "mongo"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sonarqube"
        update-types: ["version-update:semver-major"]
      - dependency-name: "opensearchproject/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "apache/kafka"
        update-types: ["version-update:semver-major"]
    groups:
      compose-images:
        patterns: ["*"]

  - package-ecosystem: docker
    directories:
      - /data/kong
      - /data/keycloak
      - /data/rabbitmq
      - /test-node
    schedule:
      interval: weekly
    groups:
      dockerfile-images:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /test-node
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
