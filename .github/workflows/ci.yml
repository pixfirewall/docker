name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose file (all profiles)
        run: docker compose --profile '*' config --quiet

      - name: ShellCheck
        run: shellcheck certs/generate_ca.sh data/postgres/init/*.sh data/kong/observability-plugins.sh data/nextcloud/hooks/*/*.sh data/stalwart/entrypoint.sh scripts/*.sh

      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          recursive: true
          dockerfile: "Dockerfile"
          ignore: DL3007,DL3008,DL3059,DL3066

      - name: Validate JSON files
        run: |
          for f in data/keycloak/import/*.json data/grafana/dashboards/*.json data/wiremock/mappings/*.json; do
            python3 -m json.tool "$f" > /dev/null && echo "ok: $f"
          done

      - name: Validate Prometheus configuration
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/data/prometheus:/etc/prometheus:ro" \
            prom/prometheus:v3.14.0 check config /etc/prometheus/prometheus.yml

      - name: Validate Alloy configuration
        run: |
          docker run --rm -e COMPOSE_PROJECT=ci \
            -v "$PWD/data/alloy:/etc/alloy:ro" \
            grafana/alloy:v1.19.2 fmt /etc/alloy/config.alloy > /dev/null

  smoke-test:
    name: Smoke test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7

      - name: Generate certificate
        run: ./certs/generate_ca.sh

      - name: Build images
        run: docker compose build kong kong-setup keycloak rabbitmq test

      - name: Start core services
        # certs are generated on the runner, the containers run as other users
        run: |
          chmod 644 certs/ca.key
          docker compose up -d --wait --wait-timeout 300 postgres kong keycloak redis rabbitmq test

      - name: Check endpoints
        run: |
          set -x
          curl -fsS http://localhost:8001/status
          curl -fsS http://localhost:8001/plugins/enabled | grep -q '"oidc"'
          curl -fsS --cacert certs/ca.pem https://localhost:8445/realms/dev/.well-known/openid-configuration > /dev/null
          curl -fsS -u test:test http://localhost:15672/api/overview > /dev/null
          curl -fsS http://localhost:3007/health
          docker compose exec -T postgres psql -U test -d postgres -tAc "select datname from pg_database" | grep -E '^(kong|keycloak)$'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose --profile '*' down -v
